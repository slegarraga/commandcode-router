name: Feature proposal
description: Propose a focused improvement.
title: "proposal: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the public behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
    validations:
      required: true
  - type: checkboxes
    id: policy
    attributes:
      label: API policy
      options:
        - label: This proposal uses documented APIs and does not bypass plan restrictions.
          required: true
